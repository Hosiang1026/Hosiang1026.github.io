# 自动化名称
name: Hexo Blog CI

# 触发条件
on:
  push:
    branches:
      - source

# 设置环境
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # check it to your workflow can access it
      # from: https://github.com/actions/checkout
      - name: Checkout Repository master branch
        uses: actions/checkout@master

      # from: https://github.com/actions/setup-node
      - name: Setup Node.js 20.x
        uses: actions/setup-node@master
        with:
          node-version: "20.x"

      - name: 安装Hexo
        run: |
          npm install hexo-cli -g
          npm install
          
      - name: 设置Git信息
        run: |
          git config --global user.name 'Hosiang1026' 
          git config --global user.email 'hosiang1026@sina.com'      

      - name: Hexo三连
        run: |
          hexo clean
          hexo generate 
          hexo deploy
          
      - name: Build and Deploy
        uses: theme-keep/hexo-deploy-github-pages-action@master # 使用专门部署 Hexo 到 GitHub pages 的 action
        env:
          PERSONAL_TOKEN: ${{ secrets.HEXO_DEPLOY }} # secret 名
          PUBLISH_REPOSITORY: Hosiang1026/Hosiang1026.github.io # 公共仓库，格式：GitHub 用户名/仓库名
          BRANCH: master # 分支，填 gh-pages 就行
          PUBLISH_DIR: ./public # 部署 public 目录下的文件
      
