name: Deploy Hexo Project to GitHub Pages
on:
  push:
    branches:
      - master  # 当 master 分支有 push 行为时触发这个 action

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'  # 指定 Node.js 版本

      - name: Install Dependencies # 安装项目依赖
        run: npm install  

      - name: Install hexo-cli   # 全局安装hexo-cli 
        run: |
          npm install -g hexo-cli 

      - name: Build Hexo # 生成 Hexo 页面
        run: |
          hexo clean
          hexo generate  
  deploy:
      runs-on: ubuntu-22.04
      permissions:
        contents: write
      steps:
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: Hosiang1026/Hosiang1026.github.io
          publish_dir: ./public
