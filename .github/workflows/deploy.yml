name: Hexo博客自动化部署
on:
  push:
    branches:
      - source  # 当 master 分支有 push 行为时触发这个 action

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'  # 指定 Node.js 版本

      - name: Install Dependencies # 安装项目依赖
        run: npm install  

      - name: Install hexo-cli   # 全局安装hexo-cli 
        run: |
          npm install -g hexo-cli 

      - name: Build Hexo # 生成 Hexo 页面
        run: |
          hexo clean
          hexo generate  

      - name: Deploy to GitHub Pages
        uses: theme-keep/hexo-deploy-github-pages-action@master # 使用专门部署 Hexo 到 GitHub pages 的 action
        env:
          PERSONAL_TOKEN: ${{ secrets.HEXO_DEPLOY }} # secret 名
          PUBLISH_REPOSITORY: Hosiang1026/Hosiang1026.github.io # 公共仓库，格式：GitHub 用户名/仓库名
          BRANCH: master # 分支，填 gh-pages 就行
          PUBLISH_DIR: ./public # 部署 public 目录下的文件



